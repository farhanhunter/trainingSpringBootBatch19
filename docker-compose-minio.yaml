services:
  minio-batch19:
    image: quay.io/minio/minio:latest
    container_name: minio-batch19
    ports:
      - "9000:9000" # port API (dipakai aplikasi)
      - "9001:9001" # port UI: http://localhost:9001 (minioadmin / minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:

#  docker compose -f docker-compose-minio.yaml up -d
#  kalau image quay.io gagal di-pull, ganti ke: minio/minio:latest
