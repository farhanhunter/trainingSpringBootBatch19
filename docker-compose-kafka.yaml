services:
  # Kafka mode KRaft: tidak butuh Zookeeper lagi
  kafka-batch19:
    image: apache/kafka:3.8.0
    container_name: kafka-batch19
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT      -> dipakai antar container (redpanda console)
      # PLAINTEXT_HOST -> dipakai aplikasi Spring di laptop (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-batch19:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-batch19:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # UI untuk melihat topic, message, consumer group: http://localhost:8088
  # (port 8080 sudah dipakai gatewayservice)
  redpanda-console-batch19:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console-batch19
    depends_on:
      - kafka-batch19
    ports:
      - "8088:8080"
    environment:
      KAFKA_BROKERS: kafka-batch19:29092

