# Kalau container belajar-postgres dari Day 1 masih jalan di port 5432,
# file ini TIDAK perlu dijalankan (database belajar_db sudah ada).
services:
  postgres-batch19:
    image: postgres:16
    container_name: postgres-batch19
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: belajar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

